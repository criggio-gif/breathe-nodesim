<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NodeSim 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div class="shell">

	<main class="space" id="space" aria-label="Spazio 3D dei nodi fisiologici">
		<div class="space-canvas" id="space-canvas"></div>
		<div class="labels" id="labels" aria-hidden="true"></div>

		<header class="hud-top">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true"></span>
				<div>
					<h1>NodeSim <span>3D</span></h1>
					<p>Il paziente ventilato come una rete di nodi fisiologici</p>
				</div>
			</div>
			<div class="hud-controls">
				<label class="sr-only" for="scenario">Scenario</label>
				<select id="scenario"></select>
				<button class="hud-btn" id="play" aria-label="Pausa" title="Pausa / riprendi">&#10074;&#10074;</button>
				<div class="seg" id="speed" role="radiogroup" aria-label="Velocità">
					<button data-speed="1" class="on" role="radio" aria-checked="true">1&times;</button>
					<button data-speed="5" role="radio" aria-checked="false">5&times;</button>
					<button data-speed="20" role="radio" aria-checked="false">20&times;</button>
				</div>
				<output class="clock" id="clock">00:00</output>
			</div>
		</header>

		<div class="legend" aria-hidden="true">
			<span><i class="dot up"></i>spinge in su</span>
			<span><i class="dot down"></i>spinge in giù</span>
			<span class="legend-hint">Trascina per ruotare · rotella per lo zoom · clic su un nodo per modificarlo</span>
		</div>

		<section class="card" id="card" hidden aria-live="polite">
			<button class="card-close" id="card-close" aria-label="Chiudi">×</button>
			<div class="card-cat"><i id="card-dot"></i><span id="card-cat"></span></div>
			<h2 id="card-title"></h2>
			<div class="card-value"><output id="card-val"></output><span id="card-unit"></span><span class="card-delta" id="card-delta"></span></div>
			<p class="card-sub" id="card-sub"></p>
			<div class="card-edit" id="card-edit"></div>
			<p class="card-desc" id="card-desc"></p>
			<div class="card-links" id="card-links"></div>
		</section>

		<div class="hud-stats" id="hud-stats" aria-hidden="true"></div>
		<div class="toast" id="toast" hidden></div>
	</main>

	<aside class="side" aria-label="Monitor e ventilatore">
		<section class="vent">
			<div class="side-head">
				<h2>Ventilatore</h2>
				<div class="seg seg-mode" id="mode" role="radiogroup" aria-label="Modalità">
					<button data-mode="VC" role="radio">VC</button>
					<button data-mode="PC" role="radio">PC</button>
					<button data-mode="CPAP" role="radio">CPAP</button>
				</div>
			</div>
			<div class="vent-set" id="vent-set"></div>
			<div class="vent-meas" id="vent-meas"></div>
		</section>

		<section class="monitor">
			<div class="monitor-screen"><canvas id="monitor" aria-label="Curve di pressione, flusso e pressione arteriosa"></canvas></div>
			<div class="vitals" id="vitals"></div>
		</section>

		<section class="actions">
			<h2>Manovre</h2>
			<div class="action-row">
				<button class="act act-primary" id="act-rm">Reclutamento 40 cmH&#8322;O &times; 30 s</button>
				<button class="act" id="act-fluid">Bolo 500 mL</button>
				<button class="act" id="act-bleed">Emorragia 500 mL</button>
			</div>
			<p class="status" id="status"></p>
		</section>
	</aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/physiology.js?v=3"></script>
<script src="js/nodes.js?v=3"></script>
<script src="js/monitor.js?v=3"></script>
<script src="js/space.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
